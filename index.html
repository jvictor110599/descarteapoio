<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Controle de Material</title>
<style>
  /* ===== CONFIGURAÇÃO FIREBASE =====
     Cole aqui as suas credenciais do Firebase.
     Veja as instruções no final do arquivo.
  ================================== */

  @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap');

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0f1117;
    --surface: #181c25;
    --surface2: #1f2433;
    --border: rgba(255,255,255,0.08);
    --border-accent: rgba(90,200,140,0.4);
    --green: #5ac88c;
    --green-dim: rgba(90,200,140,0.12);
    --red: #e05c5c;
    --red-dim: rgba(224,92,92,0.12);
    --text: #eef0f4;
    --text-muted: #7a8296;
    --text-dim: #4a5168;
    --mono: 'IBM Plex Mono', monospace;
    --sans: 'IBM Plex Sans', sans-serif;
    --radius: 8px;
    --radius-lg: 14px;
  }

  body {
    font-family: var(--sans);
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding: 2rem 1rem 4rem;
  }

  header {
    max-width: 680px;
    margin: 0 auto 2.5rem;
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    gap: 1rem;
    flex-wrap: wrap;
  }

  .header-left {}

  .header-tag {
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--green);
    margin-bottom: 6px;
  }

  h1 {
    font-family: var(--mono);
    font-size: 22px;
    font-weight: 600;
    letter-spacing: -0.02em;
    color: var(--text);
    line-height: 1.2;
  }

  .status-dot {
    display: inline-block;
    width: 7px; height: 7px;
    border-radius: 50%;
    background: var(--green);
    margin-right: 6px;
    animation: pulse 2s infinite;
  }
  .status-dot.offline { background: var(--text-dim); animation: none; }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.3; }
  }

  #status-label {
    font-family: var(--mono);
    font-size: 12px;
    color: var(--text-muted);
  }

  /* Formulário de adição */
  .add-form {
    max-width: 680px;
    margin: 0 auto 2rem;
    display: flex;
    gap: 10px;
  }

  .add-form input {
    flex: 1;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    color: var(--text);
    font-family: var(--sans);
    font-size: 15px;
    padding: 0 16px;
    height: 46px;
    outline: none;
    transition: border-color 0.15s;
  }

  .add-form input::placeholder { color: var(--text-dim); }
  .add-form input:focus { border-color: rgba(90,200,140,0.5); }

  .add-form button {
    background: var(--green);
    border: none;
    border-radius: var(--radius);
    color: #0f1117;
    font-family: var(--sans);
    font-size: 15px;
    font-weight: 600;
    padding: 0 22px;
    height: 46px;
    cursor: pointer;
    transition: opacity 0.15s, transform 0.1s;
    white-space: nowrap;
  }

  .add-form button:hover { opacity: 0.85; }
  .add-form button:active { transform: scale(0.97); }

  /* Lista de materiais */
  #lista {
    max-width: 680px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .item-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 16px 20px;
    display: flex;
    align-items: center;
    gap: 16px;
    transition: border-color 0.15s;
    animation: fadeIn 0.25s ease;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(6px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .item-card:hover { border-color: rgba(255,255,255,0.14); }

  .item-name {
    flex: 1;
    font-family: var(--sans);
    font-size: 15px;
    font-weight: 500;
    color: var(--text);
    overflow: hidden;
    white-space: nowrap;
    text-overflow: ellipsis;
  }

  .counter-group {
    display: flex;
    align-items: center;
    gap: 0;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
    flex-shrink: 0;
  }

  .btn-count {
    background: none;
    border: none;
    color: var(--text-muted);
    font-family: var(--mono);
    font-size: 20px;
    font-weight: 600;
    width: 42px;
    height: 42px;
    cursor: pointer;
    transition: background 0.12s, color 0.12s;
    display: flex;
    align-items: center;
    justify-content: center;
    line-height: 1;
    flex-shrink: 0;
  }

  .btn-count.minus:hover { background: var(--red-dim); color: var(--red); }
  .btn-count.plus:hover  { background: var(--green-dim); color: var(--green); }
  .btn-count:active { transform: scale(0.92); }

  .count-display {
    font-family: var(--mono);
    font-size: 18px;
    font-weight: 600;
    min-width: 52px;
    text-align: center;
    color: var(--text);
    padding: 0 4px;
    border-left: 1px solid var(--border);
    border-right: 1px solid var(--border);
    height: 42px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: color 0.2s;
  }

  .count-display.updated {
    color: var(--green);
  }

  .btn-delete {
    background: none;
    border: none;
    color: var(--text-dim);
    font-size: 18px;
    width: 34px;
    height: 34px;
    border-radius: 6px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.12s, color 0.12s;
    flex-shrink: 0;
    margin-left: 4px;
  }

  .btn-delete:hover { background: var(--red-dim); color: var(--red); }

  /* Estado vazio */
  #empty-state {
    max-width: 680px;
    margin: 3rem auto 0;
    text-align: center;
    display: none;
  }

  #empty-state p {
    font-family: var(--mono);
    font-size: 14px;
    color: var(--text-dim);
    line-height: 1.7;
  }

  /* Loading */
  #loading {
    max-width: 680px;
    margin: 3rem auto 0;
    text-align: center;
  }

  #loading p {
    font-family: var(--mono);
    font-size: 13px;
    color: var(--text-dim);
    animation: blink 1.2s infinite;
  }

  @keyframes blink {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.3; }
  }

  /* Aviso de config */
  #config-warning {
    max-width: 680px;
    margin: 0 auto 1.5rem;
    background: rgba(224,92,92,0.08);
    border: 1px solid rgba(224,92,92,0.3);
    border-radius: var(--radius-lg);
    padding: 16px 20px;
    display: none;
  }

  #config-warning p {
    font-family: var(--mono);
    font-size: 12px;
    color: #e08080;
    line-height: 1.7;
  }

  #config-warning a { color: var(--green); }

  .divider {
    max-width: 680px;
    margin: 0 auto 1.5rem;
    border: none;
    border-top: 1px solid var(--border);
  }
</style>
</head>
<body>

<header>
  <div class="header-left">
    <div class="header-tag">&#9632; Sistema de Controle</div>
    <h1>Contagem de Material</h1>
  </div>
  <div id="status-label">
    <span class="status-dot offline" id="status-dot"></span>
    <span id="status-text">conectando...</span>
  </div>
</header>

<div id="config-warning">
  <p>
    ⚠ Firebase não configurado. Edite o arquivo e preencha o objeto <code>firebaseConfig</code> com as credenciais do seu projeto.<br>
    <a href="https://console.firebase.google.com/" target="_blank">→ Abrir Firebase Console</a>
  </p>
</div>

<div class="add-form">
  <input type="text" id="input-nome" placeholder="Nome do material..." maxlength="60" autocomplete="off" />
  <button id="btn-adicionar">+ Adicionar</button>
</div>

<hr class="divider">

<div id="loading"><p>carregando dados...</p></div>
<div id="empty-state"><p>nenhum material cadastrado.<br>adicione um acima.</p></div>
<div id="lista"></div>

<!-- Firebase SDK v9 compat -->
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>

<script>
/* ============================================================
   🔧 CONFIGURAÇÃO FIREBASE
   ============================================================
   1. Acesse https://console.firebase.google.com/
   2. Crie um projeto (ou use um existente)
   3. Vá em "Configurações do projeto" → "Seus aplicativos" → Web (</>) 
   4. Copie o objeto firebaseConfig e cole aqui abaixo
   5. No Firebase Console, vá em "Realtime Database" → "Criar banco de dados"
   6. Nas regras (Rules), para uso interno sem autenticação, use:
      {
        "rules": {
          ".read": true,
          ".write": true
        }
      }
   ============================================================ */

  const firebaseConfig = {
    apiKey: "SUA_API_KEY",
    authDomain: "SEU_PROJETO.firebaseapp.com",
    databaseURL: "https://SEU_PROJETO-default-rtdb.firebaseio.com",
    projectId: "SEU_PROJETO",
    storageBucket: "SEU_PROJETO.appspot.com",
    messagingSenderId: "SEU_ID",
    appId: "SEU_APP_ID"
  };

/* ============================================================
   FIM DA CONFIGURAÇÃO — não é necessário editar abaixo
   ============================================================ */

  const isConfigured = !firebaseConfig.apiKey.includes("SUA_API_KEY");

  if (!isConfigured) {
    document.getElementById("config-warning").style.display = "block";
    document.getElementById("loading").style.display = "none";
    document.getElementById("empty-state").style.display = "block";
  } else {
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    const materiaisRef = db.ref("materiais");

    const lista = document.getElementById("lista");
    const loading = document.getElementById("loading");
    const emptyState = document.getElementById("empty-state");
    const statusDot = document.getElementById("status-dot");
    const statusText = document.getElementById("status-text");

    // Status de conexão
    db.ref(".info/connected").on("value", snap => {
      if (snap.val()) {
        statusDot.classList.remove("offline");
        statusText.textContent = "sincronizado";
      } else {
        statusDot.classList.add("offline");
        statusText.textContent = "sem conexão";
      }
    });

    // Escuta mudanças em tempo real
    materiaisRef.on("value", snap => {
      loading.style.display = "none";
      lista.innerHTML = "";

      const dados = snap.val();
      if (!dados || Object.keys(dados).length === 0) {
        emptyState.style.display = "block";
        return;
      }

      emptyState.style.display = "none";

      // Ordena por nome
      const itens = Object.entries(dados).sort((a, b) =>
        a[1].nome.localeCompare(b[1].nome, "pt-BR")
      );

      itens.forEach(([id, mat]) => {
        const card = document.createElement("div");
        card.className = "item-card";
        card.dataset.id = id;
        card.innerHTML = `
          <span class="item-name">${escapeHtml(mat.nome)}</span>
          <div class="counter-group">
            <button class="btn-count minus" data-id="${id}" aria-label="Diminuir">−</button>
            <span class="count-display" id="count-${id}">${mat.quantidade ?? 0}</span>
            <button class="btn-count plus" data-id="${id}" aria-label="Aumentar">+</button>
          </div>
          <button class="btn-delete" data-id="${id}" aria-label="Remover material">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="3 6 5 6 21 6"></polyline>
              <path d="M19 6l-1 14H6L5 6"></path>
              <path d="M10 11v6M14 11v6"></path>
              <path d="M9 6V4h6v2"></path>
            </svg>
          </button>
        `;
        lista.appendChild(card);
      });

      // Delegação de eventos
      lista.querySelectorAll(".btn-count.plus").forEach(btn => {
        btn.onclick = () => alterarQtd(btn.dataset.id, 1);
      });
      lista.querySelectorAll(".btn-count.minus").forEach(btn => {
        btn.onclick = () => alterarQtd(btn.dataset.id, -1);
      });
      lista.querySelectorAll(".btn-delete").forEach(btn => {
        btn.onclick = () => removerMaterial(btn.dataset.id);
      });
    });

    function alterarQtd(id, delta) {
      const ref = materiaisRef.child(id + "/quantidade");
      ref.transaction(atual => (atual ?? 0) + delta);

      // Feedback visual
      const display = document.getElementById("count-" + id);
      if (display) {
        display.classList.add("updated");
        setTimeout(() => display.classList.remove("updated"), 600);
      }
    }

    function removerMaterial(id) {
      if (confirm("Remover este material?")) {
        materiaisRef.child(id).remove();
      }
    }

    // Adicionar material
    document.getElementById("btn-adicionar").onclick = adicionarMaterial;
    document.getElementById("input-nome").onkeydown = e => {
      if (e.key === "Enter") adicionarMaterial();
    };

    function adicionarMaterial() {
      const input = document.getElementById("input-nome");
      const nome = input.value.trim();
      if (!nome) { input.focus(); return; }

      materiaisRef.push({ nome, quantidade: 0 });
      input.value = "";
      input.focus();
    }

    function escapeHtml(str) {
      return str.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
    }
  }
</script>
</body>
</html>
